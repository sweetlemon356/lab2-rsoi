name: GitHub Classroom Workflow

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keep Compose image names identical on the build and test runners.
  COMPOSE_PROJECT_NAME: lab2-rsoi-ci

jobs:
  checks:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check vet

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: make images
      - name: Archive Docker images
        run: |
          docker image save --output "$RUNNER_TEMP/service-images.tar" \
            "${COMPOSE_PROJECT_NAME}-gateway" \
            "${COMPOSE_PROJECT_NAME}-reservation" \
            "${COMPOSE_PROJECT_NAME}-payment" \
            "${COMPOSE_PROJECT_NAME}-loyalty"
      - uses: actions/upload-artifact@v4
        with:
          name: service-images
          path: ${{ runner.temp }}/service-images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  unit:
    name: Go unit tests
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-race

  integration:
    name: PostgreSQL and E2E tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: service-images
          path: ${{ runner.temp }}
      - name: Load images and start services
        run: |
          docker image load --input "$RUNNER_TEMP/service-images.tar"
          docker compose up -d --no-build --pull missing --wait --wait-timeout 120
      - name: Prepare repository test databases
        run: |
          for service in reservation payment loyalty; do
            docker compose exec -T postgres psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${service}_test OWNER ${service}_service"
            docker compose run --rm --no-deps --pull never --entrypoint /goose "$service" -dir /migrations postgres "postgres://${service}_service:test@postgres:5432/${service}_test?sslmode=disable" up
          done
      - name: PostgreSQL tests
        run: make test-postgres
        env:
          RESERVATION_TEST_DATABASE_URL: postgres://reservation_service:test@localhost:5432/reservation_test?sslmode=disable
          PAYMENT_TEST_DATABASE_URL: postgres://payment_service:test@localhost:5432/payment_test?sslmode=disable
          LOYALTY_TEST_DATABASE_URL: postgres://loyalty_service:test@localhost:5432/loyalty_test?sslmode=disable
      - name: E2E tests
        run: make test-e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v

  autograding:
    name: Classroom autograding (Newman)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Newman
        run: npm install --global newman@6.2.1
      - uses: actions/download-artifact@v4
        with:
          name: service-images
          path: ${{ runner.temp }}
      - name: Load images and start services
        run: |
          docker image load --input "$RUNNER_TEMP/service-images.tar"
          docker compose up -d --no-build --pull missing --wait --wait-timeout 120
      - name: Classroom autograding
        uses: education/autograding@v1
        id: autograder
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
